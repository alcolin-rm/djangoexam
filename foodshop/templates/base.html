<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Доставка еды{% endblock %}</title>
</head>
<body>
<header>
    <nav>
        <a href="{% url 'dish_list' %}">Меню</a>

        {% if user.is_authenticated %}
            <span>Пользователь: {{ user.username }}</span>
            <span>Бонусы: {{ user.bonus_balance }}</span>
            <a href="{% url 'my_orders' %}">Мои заказы</a>

            <form action="{% url 'logout' %}" method="post" style="display:inline;">
                {% csrf_token %}
                <button type="submit">Выйти</button>
            </form>
        {% else %}
            <a href="{% url 'login' %}">Войти</a>
            <a href="{% url 'register' %}">Регистрация</a>
        {% endif %}
    </nav>
    <hr>
</header>

<main>
    {% block content %}{% endblock %}
</main>
</body>
</html>
