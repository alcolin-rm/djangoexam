{% extends 'base.html' %}

{% block content %}
<h1>Меню</h1>

{% for dish in dishes %}
    <div style="margin-bottom: 30px;">
        {% if dish.image %}
            <img src="{{ dish.image.url }}" alt="{{ dish.name }}" width="200">
        {% endif %}
        <h2>{{ dish.name }}</h2>
        <p>Цена: {{ dish.price }} ₽</p>
        <a href="{% url 'order_create' %}?dish={{ dish.id }}">Заказать</a>
    </div>
{% empty %}
    <p>Блюд пока нет.</p>
{% endfor %}
{% endblock %}
